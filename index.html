<!DOCTYPE html>
<meta charset="utf-8">
<script src="https://d3js.org/d3.v7.min.js"></script>
<body>
<h2>AST Visualization</h2>
<svg width="600" height="400"></svg>
<script>
    const data = {"name": "Block", "children": [{"name": "=", "children": [{"name": "int threshold"}, {"name": "10"}]}, {"name": "=", "children": [{"name": "int val"}, {"name": "+", "children": [{"name": "5"}, {"name": "*", "children": [{"name": "2"}, {"name": "2"}]}]}]}, {"name": "if", "children": [{"name": "cond", "children": [{"name": "<", "children": [{"name": "0"}, {"name": "0"}]}]}, {"name": "Block", "children": [{"name": "=", "children": [{"name": "val"}, {"name": "99"}]}]}]}]};

    const root = d3.hierarchy(data);
    const treeLayout = d3.tree().size([400, 200]);
    treeLayout(root);

    const svg = d3.select('svg'), g = svg.append('g').attr('transform', 'translate(50,50)');

    g.selectAll('.link')
        .data(root.links())
        .enter().append('path')
        .attr('class', 'link')
        .attr('d', d3.linkVertical().x(d => d.x).y(d => d.y))
        .style("fill", "none")
        .style("stroke", "#ccc");

    const node = g.selectAll('.node')
        .data(root.descendants())
        .enter().append('g')
        .attr('class', 'node')
        .attr('transform', d => `translate(${d.x},${d.y})`);

    node.append('circle').attr('r', 20).style("fill", "steelblue");
    node.append('text')
        .attr('dy', 5)
        .attr('text-anchor', 'middle')
        .style("fill", "white")
        .text(d => d.data.name);
</script>
</body>
</html>
